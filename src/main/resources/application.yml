server:
  port: ${GATEWAY_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

spring:
  # Load the git-ignored .env file (key=value, like a .properties file) into the
  # Spring environment so ${JWT_SECRET}, ${CATALOG_SERVICE_URI}, ... resolve without
  # exporting anything. Real environment variables still win over .env. "optional:"
  # means a missing .env is fine (e.g. in containers where env vars are set).
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: rally-gateway

  data:
    redis:
      # Rate limiter backend. Defaults to a local Redis on 6379; override with
      # REDIS_HOST / REDIS_PORT env vars (or .env). Short timeouts so a dead Redis
      # fails open quickly instead of hanging requests.
      connect-timeout: 2s
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s

  cloud:
    gateway:
      server:
        webflux:
          # Safety net: never forward a raw JWT downstream. JwtAuthGlobalFilter strips it
          # too, but this guarantees it even if a route is added later without a filter.
          default-filters:
            - RemoveRequestHeader=Authorization
            # Rate limit EVERY request (token bucket backed by Redis — see
            # config/RateLimitingConfig.java for the key strategy). 20 req/s steady,
            # burst of 40. 429 Too Many Requests once the bucket is empty. The gateway
            # fails OPEN: if Redis is down the request still goes through.
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${CORS_ORIGIN_DEV:http://localhost:4200}
                  - ${CORS_ORIGIN_PROD:http://localhost:4200}
                allowed-methods:
                  - GET
                  - POST
                  - PATCH
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          routes:
            # ---------- Auth Service (not built yet — default port 8084) ----------
            - id: auth
              uri: ${AUTH_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/auth/**,/users/**,/profile/**

            # ---------- Auth avatars — routed to the AUTH service, NOT catalog ----------
            # User avatars (profilePicture) are stored and served by the auth service at
            # /uploads/avatars/... . This must come BEFORE the broad catalog /uploads/**
            # route (Spring Cloud Gateway uses the first matching route). Both the canonical
            # /uploads/avatars/** and the legacy /auth/uploads/avatars/** forms are covered.
            - id: auth-avatars
              uri: ${AUTH_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/uploads/avatars/**,/auth/uploads/**

            # ---------- Catalog Service (:8083) ----------
            - id: catalog
              uri: ${CATALOG_SERVICE_URI:http://localhost:8083}
              predicates:
                # uploads here related to img of products
                - Path=/products/**,/categories/**,/uploads/**

            # ---------- Participation Service (:8086) ----------
            # Specific deal sub-paths MUST come before the broad /deals/** deal route —
            # Spring Cloud Gateway uses the first matching route.
            - id: participation
              uri: ${PARTICIPATION_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/deals/*/join,/deals/*/leave,/deals/*/participants,/deals/*/participants/*,/deals/*/progress,/deals/*/activity,/deals/*/invite-link,/invites/**

            # ---------- Deal Service (:8085) ----------
            - id: deal
              uri: ${DEAL_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/deals/**

            # ---------- Order Service (:8010) ----------
            - id: order
              uri: ${ORDER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/orders/**

            # ---------- Payment Service (:8082) ----------
            - id: payment
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8082}
              predicates:
                # {userId} is a single segment — ** mid-pattern is invalid in Spring PathPattern.
                - Path=/api/payment-methods/**,/api/payments/**

            # ---------- Inventory Service (:8087) ----------
            - id: inventory
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/inventory/**

            # ---------- Notification Service (:8088) ----------
            - id: notification
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/notifications/**

rally:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}

  gateway:
    # /uploads/** is public static media (product images and user avatars) — <img> tags
    # cannot carry a JWT. AntPathMatcher requires the trailing /** to cover sub-paths:
    # a bare /uploads only matches the exact path, not /uploads/avatars/....
    public-paths:
      - /auth/login
      - /auth/register
      - /auth/verify-email
      - /auth/resend-verification-otp
      - /auth/forgot-password
      - /auth/verify-email-otp
      - /auth/verify-reset-otp
      - /auth/reset-password
      - /auth/refresh
      - /auth/logout
      - /uploads/**
      - /deals
